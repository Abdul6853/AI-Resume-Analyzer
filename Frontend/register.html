<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | AI Resume Analyzer</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="auth-page">

    <div class="auth-container">

        <div class="card">

            <h1>AI Resume Analyzer</h1>
            <p class="subtitle">Create your account and start analyzing resumes with confidence.</p>

            <h2>Create Account</h2>

            <label>Name</label>
            <input
                    type="text"
                    id="name"
                    placeholder="Enter your name">

            <label>Email</label>
            <input
                    type="email"
                    id="email"
                    placeholder="Enter your email">

                    <label>Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password">

                    <p class="access-note">Tip: To verify your password, use your device or browser's secure reveal feature. Avoid revealing passwords on shared/public devices.</p>

                    <button id="registerBtn">
                Register
            </button>

            <p id="message"></p>

            <div class="link-area">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script src="register.js"></script>

</body>

</html>
