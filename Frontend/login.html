<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AI Resume Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

<div class="container">

    <h1>AI Resume Analyzer</h1>
    <p class="subtitle">Sign in to continue optimizing your resume.</p>
    <h2>Login</h2>

    <input
        type="email"
        id="email"
        placeholder="Enter Email">

    <input
        type="password"
        id="password"
        placeholder="Enter Password">

    <p class="access-note">Tip: To verify your password, use your device or browser's secure reveal feature. Avoid revealing passwords on shared/public devices.</p>

    <button onclick="login()">
        Login
    </button>

    <p id="message"></p>

    <p class="link-area">
        Don't have an account?
        <a href="register.html">Register</a>
    </p>

</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="login.js"></script>
<!-- password peek removed -->

</body>
</html>
